name: CI

# Four jobs, because the four things that can break this library break in
# different places and need different machines:
#
#   lint     formatting and lints -- ubuntu, seconds, no linking
#   test     the Rust tests -- all three desktop OSes, because every member
#            compiles on every target, including the cdylibs
#   c-abi    the real deliverable: build the shared library and run the C smoke
#            test against it, on Linux *and* Windows (different export tables,
#            different loader rules)
#   android  cross-compile for arm64 and check the JNI export set, which is the
#            only part of this library standard JVM code can see
#   android-unit  the JVM half: Kotlin tests that pin the event table, the ABI
#            number and the JNI symbol names against this checkout
#   android-apk   the real integration: `assembleDebug` compiles the core with
#            cargo-ndk and packages it, then proves the APK carries that `.so`
#
# Deliberately absent: a macOS job that produces the XCFramework. Nothing
# consumes a CI-built framework yet -- `tools/build-macos.sh` runs locally and a
# published artifact would need a release process. The macOS *compile* is still
# covered by `test`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A superseded push has nothing to say. On a PR `github.ref` is the merge ref,
  # so two PRs do not cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `audiopus-sys` compiles libopus from C source through CMake, and its
  # CMakeLists still says `cmake_minimum_required(VERSION 3.0)`. CMake 4 refuses
  # that outright, deep inside a dependency, with an error that names nothing
  # useful. Set once here so no job can be the one that forgot it.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` in this repository pins the channel; the inputs
      # here only add the two components the checks need.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      # `cargo fmt --all` is the wrong command here, and not subtly: `--all`
      # reaches through path dependencies into `vendor/tsclientlib`, which is
      # upstream's code with upstream's `.rustfmt.toml` (hard tabs, compressed
      # expressions) and is intentionally *not* reformatted -- rewriting it would
      # turn every future re-vendor into a conflict in every file. That produced
      # 194 diffs in the vendor tree and a red lint job while our own code was
      # already clean.
      #
      # `tools/fmt.sh` is the repository's own answer: it runs rustfmt over our
      # five crates only. `cargo fmt --package` accepts `--check` the same way.
      - name: cargo fmt --check
        run: sh tools/fmt.sh --check

      # `--all-targets` matters: a lint in a test file is still a lint in this
      # repository.
      #
      # `-D warnings` is passed *after* `--` rather than through `RUSTFLAGS`, so
      # it applies to this workspace's own crates only. `RUSTFLAGS` would reach
      # every path dependency too, including `vendor/tsclientlib` -- upstream
      # code that this project does not maintain and should not be held to this
      # lint standard. (Registry dependencies are capped with
      # `--cap-lints allow` by cargo, but path dependencies are not, which makes
      # the difference real rather than theoretical.) Bonus: no `RUSTFLAGS`
      # change means no dependency rebuild.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      # `audiopus-sys` needs CMake on every platform. Linux and Windows images
      # ship it; the macOS image does not guarantee it, and `brew install` on an
      # already-present formula is a no-op.
      - name: CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: cargo test
        run: cargo test --workspace --all-targets

  c-abi:
    name: c abi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: c-abi-${{ matrix.os }}

      - name: cargo build --release
        run: cargo build --release -p litespeak

      # Linux needs no vcvars equivalent: `cc` is the same compiler family cargo
      # used, so it links against the same CRT.
      #
      # The soname is `liblitespeak.so.1`, which is what a linked binary records,
      # so the loader has to find that name next to the unversioned one -- a real
      # install ships both (`tools/build-linux.sh` copies both). And since
      # `target/release` holds `liblitespeak.a` under the same `-l` name, the
      # `NEEDED` entry is checked: without it the test would pass while exercising
      # a statically linked copy and never touch the shared library at all.
      - name: Compile and run the smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          ln -sf liblitespeak.so target/release/liblitespeak.so.1
          cc -Wall -Wextra -Werror -Iinclude tools/smoke.c \
             -Ltarget/release -llitespeak -o out/smoke-linux
          readelf -W -d out/smoke-linux | grep -q 'NEEDED.*liblitespeak\.so\.1' \
            || { echo "the smoke test linked statically"; readelf -W -d out/smoke-linux; exit 1; }
          LD_LIBRARY_PATH=target/release ./out/smoke-linux

      # The Windows loader finds a DLL next to the .exe, not on a -L path, so the
      # test links against the import library and runs beside the DLL. `cl` needs
      # its environment, which `msvc-dev-cmd` provides; a bare `cl` on a fresh
      # runner is "not recognized".
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile and run the smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          cl /nologo /W4 /utf-8 /Iinclude tools/smoke.c target/release/litespeak.dll.lib /Foout/smoke.obj /Feout/smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed to compile" }
          Copy-Item target/release/litespeak.dll out/litespeak.dll -Force
          ./out/smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed ($LASTEXITCODE)" }

      # `crates/c/build.rs` generates a version script from this header, so the
      # two cannot drift -- but only if the linker honours it. This checks the
      # result rather than the intent. Linux only: Windows has no version script,
      # so its export table can be a superset of the header by design.
      - name: Check the exported symbols and soname (Linux)
        if: runner.os == 'Linux'
        run: |
          lib=target/release/liblitespeak.so

          readelf -W --dyn-syms "$lib" \
            | awk '$4 == "FUNC" && $5 == "GLOBAL" && $7 != "UND" { print $8 }' \
            | sed 's/@@.*//' | sort -u > exported.txt

          grep 'LITESPEAK_CALL litespeak_' include/litespeak.h \
            | sed 's/.*LITESPEAK_CALL \([a-z_0-9]*\).*/\1/' \
            | sort -u > expected.txt

          cat exported.txt
          if ! diff -u expected.txt exported.txt; then
            echo "the header and the exported symbols disagree"
            exit 1
          fi

          # A shell links against `liblitespeak.so.1`; without the soname it
          # records an absolute path into a build directory instead.
          readelf -W -d "$lib" | grep -q 'SONAME.*liblitespeak\.so\.1' \
            || { echo "missing soname liblitespeak.so.1"; readelf -W -d "$lib"; exit 1; }

  android:
    name: android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      # Pinned to the NDK this repository is actually built with. A floating
      # "latest" would swap the sysroot under a fixed toolchain and produce a
      # `.so` nobody ever ran on a device. `add-to-path` is what `cargo ndk`
      # looks for; the output path is passed explicitly below as well.
      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Point cargo at the NDK
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # Installs into ~/.cargo/bin, which is outside any toolchain directory, so
      # it survives rust-toolchain.toml switching the active toolchain.
      - name: cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: cargo ndk build
        run: cargo ndk -t arm64-v8a -o out/android build --release -p litespeak-jni

      # The JNI layer is the one place where a missing symbol is not a compile
      # error: the JVM resolves each native method lazily, so a rename shows up
      # as an UnsatisfiedLinkError on a device, at runtime. The expected names are
      # read out of the crate, so this proves the `.so` exports exactly what the
      # crate declares -- no more (a stray `no_mangle` helper would be visible to
      # the JVM) and no less.
      #
      # Whether those names still match the Kotlin declarations is checked by
      # `android-unit` below: `NativeSymbolsTest` derives the expected prefix
      # from the class and compares it with these same `fn Java_...` lines.
      - name: Check the JNI export set
        run: |
          readelf=$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name llvm-readelf | head -1)
          so=out/android/arm64-v8a/liblitespeak_jni.so

          "$readelf" -W --dyn-syms "$so" \
            | awk '$4 == "FUNC" && $5 == "GLOBAL" && $7 != "UND" { print $8 }' \
            | sed 's/@@.*//' | sort -u > exported.txt

          grep -oE 'pub extern "system" fn [A-Za-z_0-9]+' crates/jni/src/lib.rs \
            | awk '{ print $NF }' | sort -u > expected.txt

          cat exported.txt
          if ! diff -u expected.txt exported.txt; then
            echo "the JNI crate declares a different set of functions than the .so exports"
            exit 1
          fi

      # An accidental dependency on a system library Android does not ship on
      # every version the app supports (`libc++_shared`, for instance) only shows
      # up as a crash-on-load on one device in the field. Printing the list makes
      # an unexpected addition visible in the log; the .so is uploaded so a
      # change can be inspected before it ships.
      - name: List the dynamic dependencies
        run: |
          readelf=$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name llvm-readelf | head -1)
          "$readelf" -W -d out/android/arm64-v8a/liblitespeak_jni.so | grep NEEDED

      - name: Upload the library
        uses: actions/upload-artifact@v4
        with:
          name: liblitespeak_jni-arm64-v8a
          path: out/android/arm64-v8a/liblitespeak_jni.so
          if-no-files-found: error

  android-unit:
    name: jvm unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The default (`enhanced`) provider, not `basic`. Basic has no restore keys:
      # any edit to a build file changes the key and the next run starts from an
      # empty Gradle User Home.
      - uses: gradle/actions/setup-gradle@v6

      # The Apache-2.0 notice obligation covers the *binary* that ships, so the
      # copies under assets/ have to be the ones the root NOTICE refers to. A
      # byte-for-byte check is the only version of this that cannot rot.
      - name: Licenses match the root
        run: |
          for f in LICENSE-APACHE LICENSE-MIT NOTICE; do
            cmp "shells/android/app/src/main/assets/licenses/$f" "$f" \
              || { echo "assets/licenses/$f differs from the repository copy"; exit 1; }
          done

      # `testDebugUnitTest` has no dependency on `buildCoreJni*`, and no `.so`
      # exists on this runner at all: a test that reached into the native library
      # would fail with UnsatisfiedLinkError instead of passing on a binary some
      # earlier step left behind.
      - name: Unit tests
        working-directory: shells/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: shells/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  android-apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-linux-android

      # `Gradle` runs the cargo task at the repository root, so the cache is the
      # root `target/`, which is where the Gradle task runs cargo.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: apk

      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      # `build.gradle.kts` reads ANDROID_NDK_HOME first and falls back to the
      # newest NDK in the SDK, so this both selects the NDK and keeps the Gradle
      # task in agreement with CI.
      - name: Point Gradle at the NDK
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Build the APK
        working-directory: shells/android
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CMAKE_GENERATOR: Ninja
        run: ./gradlew :app:assembleDebug --no-daemon

      # Proves the wiring, not just that a file appeared: the packaged `.so` has
      # to be byte-identical to the stripped artifact Gradle derived from the
      # cargo task, or something else supplied it.
      - name: Check the packaged library
        run: |
          generated=shells/android/app/build/generated/coreJniLibs/debug/arm64-v8a/liblitespeak_jni.so
          stripped=shells/android/app/build/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib/arm64-v8a/liblitespeak_jni.so
          test -f "$generated" || { echo "the cargo task produced nothing"; exit 1; }
          test -f "$stripped" || { echo "the strip task produced nothing"; exit 1; }

          apk=$(find shells/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          unzip -p "$apk" lib/arm64-v8a/liblitespeak_jni.so > packaged.so
          cmp -s "$stripped" packaged.so \
            || { echo "the APK does not contain the library Gradle just built"; exit 1; }

          size=$(stat -c %s "$generated")
          echo "packaged liblitespeak_jni.so: $size bytes"
          # A stub or a truncated file would also compare equal; this bounds it.
          test "$size" -gt 4000000

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: shells/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
