[workspace]
resolver = "2"
members = ["crates/core", "crates/c", "crates/jni", "crates/cli", "crates/account-demo"]
# `vendor/tsclientlib` is its own workspace (upstream's layout, unchanged). It is
# excluded here so cargo does not try to adopt it, and referenced by path from
# `crates/core` instead: the protocol stack has to be editable, because the
# myTeamSpeak ID signature depends on a handshake value upstream hardcodes.
exclude = ["vendor/tsclientlib"]
# `vendor/tsclientlib` keeps upstream's own formatting (hard tabs, compressed
# params). `cargo fmt --all` would rewrite ~500 upstream files, so the wrapper is
# `cargo fmt -- --check` over our members only — see `tools/fmt.sh`.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Schallophy/litespeak"
publish = false

[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pinned by revision on purpose: the whole point of this crate is a reproducible
# build. A floating git dependency means two builds of the same commit can
# produce different libraries.
#
# choose rev = master@2026-07-22, which carries the AudioQueue "partial packet"
# fix (servers that send more than one frame per packet used to decode as
# broken audio). crates.io's 0.2.0 predates it.
#
# **Vendored, not a git dependency.** The copy under `vendor/tsclientlib` is
# upstream at the revision below, unmodified except where a comment says so. It
# lives in the tree because the myTeamSpeak ID proof needs two things upstream
# does not expose: the connection's `shared_iv` (hence `unstable`) and, more
# importantly, the length of that IV — the server decides between a 20-byte and a
# 64-byte `beta`, and upstream hardcodes 54. Editing a git dependency is not
# possible; a fork would be a separate repo to keep in step. A path dependency is
# the only form where the change is reviewable next to the reason for it.
#
# Upstream revision: ee3bc6f45a7137db7793ba5593a321df400d53e5 (master, 2026-07-22)
# default-features is off so the feature set is named here rather than inherited
# from upstream: `unstable` exposes the shared IV, and `audio` is the Opus path
# the session uses. tsclientlib's own nickname lookup goes through the ureq
# dependency below; there is no reqwest/hyper/tower in this graph.
tsclientlib = { path = "vendor/tsclientlib/tsclientlib", default-features = false, features = ["unstable", "audio"] }
# Not re-exported by tsclientlib, but needed to build outgoing audio packets.
tsproto-packets = { path = "vendor/tsclientlib/utils/tsproto-packets" }
# Needed to tell "wrong server password" apart from every other way a server can
# refuse a connection: `Error::ConnectTs` carries this enum, and matching on it
# is the only way to show a useful message instead of an English enum name.
# Also the source of the identity key type for `identity_to_ts_str`.
tsproto-types = { path = "vendor/tsclientlib/utils/tsproto-types" }
# The TeamSpeak-published version table (CSV), decoded into signed
# (platform, version text, signature) rows. litespeak-core reads it to resolve a
# shell's version choice to a signed tuple; it is already in the tree (tsproto-types
# builds against it), so this adds no new dependency to resolve.
tsproto-structs = { path = "vendor/tsclientlib/utils/tsproto-structs" }

audiopus = "0.3.0-rc.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net"] }
futures = "0.3"

# Account side (myTeamSpeak login, key chain, sync items).
#
# Most of these are versions the tree already resolves: `sha2`, `hmac`,
# `base64`, `rand` and `aes` come in with `tsclientlib`, and rustls/ring come
# in with `ureq`. `aes-gcm` is used for exactly one thing — the sjcl GCM blob
# the login key arrives in.
#
# `pbkdf2` is deliberately *not* a dependency: the two derivations are
# PBKDF2-HMAC-SHA512 with a single output block, which is 20 lines over `hmac`,
# and the crate's newer releases want a digest generation this tree does not
# have.
#
# `ctr` is only the mode: the item cipher is AES-256-CTR with a **32-bit
# little-endian counter in word 0** of the 16-byte header, which is exactly
# `ctr::Ctr32LE`. Using the crate rather than hand-rolling block alignment keeps
# the "how does the counter advance" question answered by a tested
# implementation instead of by this file.
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
ctr = "0.9"
base64 = "0.22"
rand = "0.10"
# No `blocking` feature: the account client is async and driven by its own
# runtime, so `exec` never spawns a second reactor thread per request.
#
# `rustls-no-provider` + an explicit ring provider, instead of `default-tls`
# (which selects aws-lc-rs). aws-lc-sys builds a large C/assembly tree, is the
# slowest single dependency to compile, and adds a few hundred KB to the
# library. ring is the provider rustls supports everywhere this ships, and
# `rustls-platform-verifier` still supplies the platform trust anchors.
# `ureq` is blocking and much smaller than reqwest: no hyper, no tower, no
# tokio-rustls. The account client is async, so its calls go through
# `spawn_blocking`; that is a reasonable price for removing an async HTTP stack
# from a library whose only HTTP traffic is a handful of REST/RPC requests.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[profile.dev]
# Line tables only. The default is full debug info (`debug = 2`), and that is
# what turned `target/` into 10 GB of object files; line numbers are enough for
# a panic stack from a test or a shell.
debug = 1
# The dev default is 256 codegen units, so a 306-crate graph leaves ~200k
# object files behind. Sixteen still fills a laptop's cores without the file
# churn; the difference is visible in both compile time and `du -sh target`.
codegen-units = 16

# Dependencies do not need their own debug info to debug this project, and they
# are the bulk of the tree. Their symbols stay; only the DWARF goes.
[profile.dev.package."*"]
debug = 0

# Tests link the whole core once per file. Full debug info made each binary 45 MB
# and the link the slowest part of `cargo test`; line tables are not worth that
# when a failing assertion prints the source line anyway.
[profile.test]
debug = 1
codegen-units = 16

[profile.test.package."*"]
debug = 0

# Android debug APKs used to build the core with the release profile, fat LTO
# and one codegen unit included: a single Rust change paid the full shipping
# link. `opt-level = 1` keeps audio and crypto usable on a phone while the build
# stays in the same class as a debug build.
[profile.android-dev]
inherits = "dev"
opt-level = 1
debug = 0
strip = "symbols"
lto = false
codegen-units = 16

# Local optimised builds: `cargo build --profile local` for something close to
# shipping without the fat-LTO link. `release` stays the shipping profile.
[profile.local]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.release]
# A ~5 MB library, not 40 MB. `z` is enough: this is network and audio code, not
# a hot numerical loop.
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
# `unwind`, not `abort`. With abort, one panicking `unwrap` inside the protocol
# stack kills the whole host process with a SIGABRT that names no cause — in
# Android that reads as "connecting closes the app", and on desktop as "the app
# vanishes". Unwinding lets every FFI boundary catch it and report an error.
panic = "unwind"
