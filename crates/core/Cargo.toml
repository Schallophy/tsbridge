[package]
name = "tsbridge-core"
description = "Platform-neutral TeamSpeak 3 client session: connection, state, events, voice, file transfers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No FFI here, and no platform dependencies: this crate must build for every
# target the desktop and mobile shells need, so nothing in it may mention
# Android, JNI, or any app-defined type.
[dependencies]
tsclientlib.workspace = true
tsproto-packets.workspace = true
tsproto-types.workspace = true
audiopus.workspace = true
tokio.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
ctr.workspace = true
# Only for the myTeamSpeak ID signature: it is a stock Ed25519 signature made
# from the account's raw scalar, and this crate is already in the tree (tsproto
# depends on it), so this adds nothing new to resolve.
curve25519-dalek-ng = "4.1.1"
base64.workspace = true
rand.workspace = true
reqwest.workspace = true
# The version table: resolves a shell's (version number, platform) choice to the
# signed (platform, full version text, signature) tuple the server expects.
tsproto-structs.workspace = true
